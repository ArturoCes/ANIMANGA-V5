# Perfil para desplegar la demo sin base de datos externa:
# H2 en memoria, el catálogo y los usuarios de prueba se regeneran en cada arranque.
spring.datasource.url=jdbc:h2:mem:animanga;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
jwt.secret=${JWT_SECRET}
