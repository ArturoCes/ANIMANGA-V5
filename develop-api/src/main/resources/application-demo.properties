# Despliegue de la demo sin base de datos externa: H2 en memoria,
# los datos de ejemplo se regeneran en cada arranque.
spring.datasource.url=jdbc:h2:mem:animanga;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
app.jwt.secret=${JWT_SECRET}

# Arranque más rápido en la demo (plan gratuito con poca CPU): cada parte se crea la primera vez que se usa
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
