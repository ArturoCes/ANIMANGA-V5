# PostgreSQL. DATABASE_URL en formato JDBC, o bien DB_HOST/DB_PORT/DB_NAME por separado.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.h2.console.enabled=false
# En producción las imágenes se guardan en la base de datos para que no se pierdan entre despliegues
app.storage.type=${STORAGE_TYPE:database}
app.jwt.secret=${JWT_SECRET}
