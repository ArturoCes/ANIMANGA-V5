# Todas las credenciales llegan por variables de entorno
# DATABASE_URL en formato JDBC, o bien DB_HOST/DB_PORT/DB_NAME por separado
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQL10Dialect

# Modo demo: el catálogo se regenera en cada arranque.
# Para conservar datos entre despliegues usar DDL_AUTO=update (import.sql solo corre con create/create-drop).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}

spring.h2.console.enabled=false
jwt.secret=${JWT_SECRET}
