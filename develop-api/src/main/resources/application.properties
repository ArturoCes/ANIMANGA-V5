spring.application.name=animanga-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

# --- Seguridad (en producción JWT_SECRET es obligatorio)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:30}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:7}
app.login.max-attempts=5
app.login.block-minutes=15
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- Enlaces de los emails (verificación y recuperación de contraseña)
app.frontend-url=${FRONTEND_URL:http://localhost:5000}
app.mail.from=${MAIL_FROM:Animanga <no-reply@animanga.dev>}

# --- Imágenes: filesystem (disco) o database (tabla stored_file)
app.storage.type=${STORAGE_TYPE:filesystem}
app.storage.location=${STORAGE_LOCATION:./uploads}

# --- Datos de demostración
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:Admin1234}
app.seed.user-password=${DEMO_USER_PASSWORD:Demo1234}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
management.endpoints.web.exposure.include=health
