spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

# JWT: en producción JWT_SECRET es obligatorio (ver application-prod.properties)
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-dev-only-secret-change-me}
# Duración del token de acceso en minutos (1 día)
jwt.duration=${JWT_DURATION_MINUTES:1440}
# Duración del refresh token en minutos (7 días)
jwt.refresh.duration=${JWT_REFRESH_DURATION_MINUTES:10080}

# Orígenes permitidos por CORS (separados por comas, admite patrones)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

storage.location=${STORAGE_LOCATION:./uploads}
spring.data.rest.max-page-size=100

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

springdoc.swagger-ui.path=/swagger-ui.html
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8
